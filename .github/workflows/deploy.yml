# Build, prerender and check the site on every push; deploy to Firebase
# Hosting from master, from the admin panel's "Publish" button
# (repository_dispatch: publish), or by hand (Actions -> Run workflow).
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   variables: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#              VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#              VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
#              VITE_FIREBASE_MEASUREMENT_ID   (the public web config from .env)
#   secret:    FIREBASE_SERVICE_ACCOUNT  (JSON key of a service account with
#              the "Firebase Hosting Admin" role only)
name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Skipped until the repository variables above are set.
    if: vars.VITE_FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium for prerendering
        run: npx playwright-core install --with-deps chromium

      - name: Cache optimized-image downloads
        uses: actions/cache@v4
        with:
          path: .content/img-cache
          key: img-cache-${{ github.run_id }}
          restore-keys: img-cache-

      - run: npm run build
      - run: node scripts/check-site.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: portfolio-8b0ca
          channelId: live
